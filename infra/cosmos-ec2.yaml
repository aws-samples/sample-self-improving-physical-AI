AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cosmos 3 World Model on EC2 — GPU instance running NVIDIA NIM container
  for world generation and physical reasoning in the self-improving loop.

Parameters:
  InstanceType:
    Type: String
    Default: g6.xlarge
    AllowedValues:
      - g6.xlarge       # 1x L4 24GB — Cosmos3-Edge / Predict2.5
      - g5.xlarge       # 1x A10G 24GB — Cosmos3-Edge / Predict2.5
      - g6e.4xlarge     # 1x L40S 48GB — Cosmos3-Nano Reasoner
      - p5.2xlarge      # 1x H100 80GB — Cosmos3-Nano full
      - p5.4xlarge      # 2x H100 80GB — Cosmos3-Super
      - p5.8xlarge      # 4x H100 80GB — Cosmos3-Super (high TP)
    Description: EC2 instance type (must have NVIDIA GPU)

  NgcApiKey:
    Type: String
    NoEcho: true
    Description: NVIDIA NGC API Key (from org.ngc.nvidia.com/setup)

  CosmosModel:
    Type: String
    Default: cosmos3-generator
    AllowedValues:
      - cosmos3-generator
      - cosmos-predict1-7b-text2world
      - cosmos-predict1-7b-video2world
      - cosmos-predict2.5-2b
      - cosmos-transfer2.5-2b
    Description: Which Cosmos NIM container to deploy

  ModelSize:
    Type: String
    Default: nano
    AllowedValues: [nano, super]
    Description: Model size for cosmos3-generator (nano=8B, super=32B)

  Precision:
    Type: String
    Default: fp8
    AllowedValues: [bf16, fp8, nvfp4]
    Description: Quantization precision

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet (must have internet access for NGC pull)

  AllowedCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR allowed to access Cosmos API (port 8000)

Mappings:
  RegionAMI:
    us-west-2:
      AMI: ami-0a0e5d9c7acc336f1   # Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04)
    us-east-1:
      AMI: ami-0b4f379183e5706b9
    ap-southeast-1:
      AMI: ami-0c1907b2de1e0b4e9
    ap-southeast-2:
      AMI: ami-0d3f4b7a89d6e2c6a

Resources:
  CosmosSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cosmos World Model NIM
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedCidr
          Description: Cosmos API
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH
      Tags:
        - Key: Name
          Value: cosmos-nim-sg

  CosmosRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cosmos-nim-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: CosmosECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'

  CosmosInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CosmosRole

  CosmosInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionAMI, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref CosmosSecurityGroup
      IamInstanceProfile: !Ref CosmosInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 500
            VolumeType: gp3
            Iops: 6000
            Throughput: 500
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub cosmos-nim-${CosmosModel}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/cosmos-setup.log) 2>&1

          echo "=== Cosmos NIM Setup Starting ==="
          export NGC_API_KEY="${NgcApiKey}"
          export DEBIAN_FRONTEND=noninteractive

          # Wait for NVIDIA driver
          for i in $(seq 1 30); do
            nvidia-smi && break || sleep 10
          done

          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com | sh
            systemctl enable docker && systemctl start docker
          fi

          # Install NVIDIA Container Toolkit if not present
          if ! dpkg -l nvidia-container-toolkit &> /dev/null; then
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey |               gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
            curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list |               sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' |               tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
            apt-get update && apt-get install -y nvidia-container-toolkit
            nvidia-ctk runtime configure --runtime=docker
            systemctl restart docker
          fi

          # Docker login to NGC
          echo "$NGC_API_KEY" | docker login nvcr.io --username '$oauthtoken' --password-stdin

          # Create cache directory
          mkdir -p /opt/nim-cache
          chmod 777 /opt/nim-cache

          # Create systemd service
          cat > /etc/systemd/system/cosmos-nim.service << 'EOF'
          [Unit]
          Description=NVIDIA Cosmos NIM World Model
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=30
          TimeoutStartSec=900
          ExecStartPre=-/usr/bin/docker rm -f cosmos-nim
          ExecStart=/usr/bin/docker run --rm               --name cosmos-nim               --runtime=nvidia --gpus all               --shm-size=32GB               --ulimit nofile=65536:65536               -e NGC_API_KEY=${NgcApiKey}               -e NIM_MODEL_SIZE=${ModelSize}               -e NIM_PRECISION=${Precision}               -e NIM_PERF_PROFILE=latency               -v /opt/nim-cache:/opt/nim/.cache               -p 8000:8000               nvcr.io/nim/nvidia/${CosmosModel}:1.0.0
          ExecStop=/usr/bin/docker stop cosmos-nim

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable cosmos-nim
          systemctl start cosmos-nim

          echo "=== Cosmos NIM Setup Complete ==="
          echo "API will be available at http://$(hostname -I | awk '{print $1}'):8000 once model loads"

Outputs:
  InstanceId:
    Value: !Ref CosmosInstance
    Description: EC2 Instance ID

  PrivateIp:
    Value: !GetAtt CosmosInstance.PrivateIp
    Description: Private IP address

  CosmosEndpoint:
    Value: !Sub "http://${CosmosInstance.PrivateIp}:8000"
    Description: Cosmos NIM API endpoint (accessible from VPC)

  SSHCommand:
    Value: !Sub "ssh -i ${KeyPairName}.pem ubuntu@${CosmosInstance.PrivateIp}"
    Description: SSH command to connect

  HealthCheck:
    Value: !Sub "curl -s http://${CosmosInstance.PrivateIp}:8000/v1/health/ready"
    Description: Health check command

  SetupLog:
    Value: "ssh in and run: tail -f /var/log/cosmos-setup.log"
    Description: How to check setup progress
